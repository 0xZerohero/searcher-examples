[package]
name = "jito-searcher-client"
version = "0.1.0"
edition = "2021"
description = "Wrapper around the generated gRPC. Adds auth and retry semantics."

[dependencies]
futures-util = "0.3.28"
jito-protos = { path = "../jito_protos" }
log = "0.4"
prost-types = "0.14.1"
solana-client = "3.0.0"
solana-commitment-config = "3.0.0"
solana-metrics = "3.0.0"
solana-sdk = "3.0.0"
solana-transaction-status = "3.0.0"
thiserror = "2.0.17"
tokio = "1"
tonic = { version = "0.14.2", features = [
    # "tls",
    # "tls-roots",
    # "tls-webpki-roots",
    "tls-native-roots",
] }
